name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docworkspace
          POSTGRES_PASSWORD: docworkspace
          POSTGRES_DB: docworkspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docworkspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docworkspace:docworkspace@localhost:5432/docworkspace
      TEST_DATABASE_URL: postgresql+psycopg://docworkspace:docworkspace@localhost:5432/docworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install (pinned, dev)
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Migrate + seed twice (idempotency on PostgreSQL)
        run: |
          alembic upgrade head
          python scripts/seed_demo.py
          python scripts/seed_demo.py
      - name: Boot smoke test
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/health/live && break; sleep 0.5; done
          curl -sf localhost:8000/health/ready
          curl -sf -X POST localhost:8000/api/demo/login -H 'content-type: application/json' \
            -d '{"login_key":"alice"}' > /dev/null
      - name: Tests (PostgreSQL)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docworkspace
          POSTGRES_PASSWORD: docworkspace
          POSTGRES_DB: docworkspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docworkspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docworkspace:docworkspace@localhost:5432/docworkspace
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - name: Install frontend + e2e
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium
      - name: Playwright (critical journeys)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
