name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docworkspace
          POSTGRES_PASSWORD: docworkspace
          POSTGRES_DB: docworkspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docworkspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docworkspace:docworkspace@localhost:5432/docworkspace
      TEST_DATABASE_URL: postgresql+psycopg://docworkspace:docworkspace@localhost:5432/docworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Migrate + seed twice (idempotency on PostgreSQL)
        run: |
          alembic upgrade head
          python scripts/seed_demo.py
          python scripts/seed_demo.py
      - name: Boot smoke test
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/health/live && break; sleep 0.5; done
          curl -sf localhost:8000/health/ready
          curl -sf -X POST localhost:8000/api/demo/login -H 'content-type: application/json' \
            -d '{"login_key":"alice"}' > /dev/null
      - name: Tests (PostgreSQL)
        run: pytest
