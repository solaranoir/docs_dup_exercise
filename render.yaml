# Render Blueprint: API + managed PostgreSQL + static frontend.
databases:
  - name: docworkspace-db
    databaseName: docworkspace
    user: docworkspace
    # Paid plan: free Postgres expires after 30 days (ours on ~2026-11-28) and has no backups.
    # Upgrade in the dashboard first; this keeps a Blueprint sync from reverting it.
    plan: basic-256mb

services:
  - type: web
    name: docworkspace-api
    runtime: python
    # Starter (Phase 6 decision): no sleeping, so no 30–50 s cold start, and pre-deploy commands.
    # Upgrade in the dashboard too; this keeps a Blueprint sync from reverting it.
    plan: starter
    rootDir: backend
    # Non-editable install: an editable install once kept serving stale code after a
    # "successful" deploy (#30). /health/live reports the served commit.
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    # Migrations run once per deploy, before the new instance starts. If one fails the deploy
    # fails and the previous version keeps serving. scripts/migrate.py is `alembic upgrade head`
    # that also lets a rollback deploy older code onto a newer schema (RUNBOOK → Rollback and
    # migrations). No demo seed: demo auth is disabled in production (ADR-009).
    preDeployCommand: python scripts/migrate.py
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: docworkspace-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # JSON list, e.g. ["https://docworkspace-web.onrender.com"]
      # OAuth sign-in (ADR-009). Callback: https://docworkspace-web.onrender.com/api/auth/{github,google}/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Attachment storage (Cloudflare R2). Values are set in the dashboard, never in git.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  - type: web
    name: docworkspace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Proxy /api to the API so the browser sees one origin and the session cookie stays
    # first-party (separate onrender.com subdomains are cross-site).
    routes:
      - type: rewrite
        source: /api/*
        destination: https://docworkspace-api.onrender.com/api/*
      # SPA fallback for path routes (/doc/:id, DOC-013). Render serves real files (assets,
      # favicon) first and applies rewrites in order, so /api/* above still wins.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # Tiptap renders font sizes as inline style attributes, hence style-src 'unsafe-inline'.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    envVars:
      - key: NODE_VERSION
        value: "22"
