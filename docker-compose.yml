# Local object storage: run `python -m moto.server -p 9000` from backend/ (see README).
# (minio/minio could not be pulled from Docker Hub when this was set up.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docworkspace
      POSTGRES_PASSWORD: docworkspace
      POSTGRES_DB: docworkspace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "docworkspace"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
